name: keep supabase alive
on:
  schedule:
    - cron: '0 0 * * 1,4' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/folders?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
